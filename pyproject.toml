[project]
name = "sreebhavan-api"
version = "0.1.0"
description = "FastAPI backend for the Sreebhavan Veg Hotel and Sreebhavanam websites"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP046"]  # B008: FastAPI Depends(); UP046: keep Generic[T] for pydantic models

[tool.ruff.lint.per-file-ignores]
# The request table reads better unwrapped.
"scripts/build_postman.py" = ["E501"]
